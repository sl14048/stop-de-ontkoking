<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eigen recepten</title>
    <link rel="stylesheet" href=node_modules/bootstrap/dist/css/bootstrap.min.css>
    <link rel="stylesheet" href="css/eigenrecpt.css">
</head>
<body>
    <header>
    <div class="nav-container">
      <div class="logo"><a href="index.html">Stop De Ontkoking</a></div> 
      <nav>
        <ul id="butons">
          <li><a href="overzicht.html">Populaire gerechten</a></li>
          <li><a href="bakkerij.html">Bakkerij</a></li>
        </ul>
      </nav>
      <div class="signup">
        <a class="sign" href="signin.html">sign up</a>
        <a class="log" href="login.html">login</a>
      </div>
    </div>
  </header>
  <div class="form">
    <h2>Voeg je eigen recept!</h2>
    <form action="">
      <label for="receptnaam">Recept naam:</label>
      <input type="text" id="receptnaam" name="receptnaam">
      <label for="ingrediënten">Omschrijving:</label>
      <textarea id="ingrediënten" name="ingrediënten" rows="4" cols="50"></textarea><br>
      <label for="instructies">Recept:</label>
      <textarea id="instructies" name="instructies" rows="4" cols="50"></textarea><br>
      <label for="duur">Duur:</label>
      <input type="time" id="duur" name="duur"><br><br>
      <label for="gerecht">Type Gerecht</label>
      <select id="gerecht" name="gerecht">
        <option value="ontbijt">Ontbijt</option>
        <option value="lunch">Lunch</option>
        <option value="diner">Diner</option>
        <option value="bakkerij">Bakkerij</option>
      </select><br><br>
      <label for="foto">Voeg een foto van de eten</label>
      <input type="file" id="foto" name="foto" accept="image/*"><br><br>
      <input type="submit" value="Deel reccept!">
    </form>
  </div>
</body>
</html>
